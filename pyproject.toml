[project]
name = "kalshi-readonly"
version = "0.1.0"
description = "Read-only Kalshi Trade API MCP server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.scripts]
kalshi-readonly = "server:main"

[tool.setuptools]
py-modules = ["server"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
